# Local development infrastructure only. Credentials here are dev-only defaults.
# Ports differ from SFF Eats (5450/6393/8334) and SFF Automation (5440/6391/8333) so all
# stacks run side by side.
name: sff-taxi

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: taxi_owner
      POSTGRES_PASSWORD: taxi_owner_dev
      POSTGRES_DB: taxi
      TZ: Asia/Tashkent
    ports:
      - '5460:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taxi_owner -d taxi']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6394:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible storage for driver documents and photos (dev credentials in
  # infra/seaweedfs/s3.json). Private: no anonymous read, the API hands out presigned URLs.
  s3:
    image: chrislusf/seaweedfs:4.47
    command: >-
      server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=256 -volume.max=0
    ports:
      - '8335:8333'
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  pgdata:
  redisdata:
  s3data:
