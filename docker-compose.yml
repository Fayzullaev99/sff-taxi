# Local development infrastructure only. Credentials here are dev-only defaults.
# Ports differ from SFF Eats (5450/6393) and SFF Automation (5440/6391) so all stacks run
# side by side.
name: sff-taxi

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: taxi_owner
      POSTGRES_PASSWORD: taxi_owner_dev
      POSTGRES_DB: taxi
      TZ: Asia/Tashkent
    ports:
      - '5460:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taxi_owner -d taxi']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6394:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
