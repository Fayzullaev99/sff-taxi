<!doctype html>
<html lang="uz-Latn">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* 1200x630 Open Graph card and the square icons, rendered by og-image.mjs */
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
        background: #ffc400;
        color: #111;
        overflow: hidden;
        position: relative;
      }
      .card {
        padding: 72px 80px;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 40px;
        font-weight: 800;
      }
      .mark {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #111;
        display: grid;
        place-items: center;
      }
      h1 {
        font-size: 86px;
        line-height: 1.02;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-top: 56px;
        max-width: 980px;
      }
      h1.small {
        font-size: 72px;
      }
      p {
        font-size: 34px;
        margin-top: 28px;
        color: #3d3d3d;
        max-width: 900px;
        line-height: 1.3;
      }
      [hidden] {
        display: none !important;
      }
      .code {
        display: inline-block;
        align-self: flex-start;
        margin-top: 28px;
        background: #111;
        color: #ffc400;
        font-size: 54px;
        font-weight: 800;
        letter-spacing: 0.14em;
        padding: 10px 28px;
        border-radius: 18px;
      }
      .stripe {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 22px;
        background: repeating-linear-gradient(90deg, #111 0 44px, transparent 44px 88px);
      }
      .site {
        position: absolute;
        right: 80px;
        bottom: 56px;
        font-size: 30px;
        font-weight: 700;
      }
      /* icons */
      body.icon {
        width: 512px;
        height: 512px;
        background: #ffc400;
        display: grid;
        place-items: center;
      }
      body.icon svg {
        width: 400px;
        height: 400px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <span class="mark">
          <svg
            width="40"
            height="40"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#ffc400"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11" />
            <path d="M3 13.5A1.5 1.5 0 0 1 4.5 12h15a1.5 1.5 0 0 1 1.5 1.5V17H3z" />
            <circle cx="7" cy="17" r="1.3" fill="#ffc400" />
            <circle cx="17" cy="17" r="1.3" fill="#ffc400" />
            <path d="M9 3h6" />
          </svg>
        </span>
        SFF Taxi
      </div>
      <h1 id="title">Guliston taksisi — qat’iy narx, surge yo‘q</h1>
      <p id="sub">Narx buyurtmadan oldin ko‘rinadi va yo‘lda o‘zgarmaydi. Naqd yoki karta.</p>
      <div id="code" class="code" hidden>GULISTON</div>
    </div>
    <div class="site" id="site">taxi.sff.uz</div>
    <div class="stripe"></div>
  </body>
</html>
