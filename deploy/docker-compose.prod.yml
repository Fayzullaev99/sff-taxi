# Single-server production layout (a 4 vCPU / 8 GB VPS in an Uzbek data centre).
# Run it through the wrapper, from anywhere:
#   deploy/compose.sh up -d          # = docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod
# Step by step: docs/deploy.md. Incidents: docs/runbook.md.
#
# Optional parts are compose profiles, switched on with COMPOSE_PROFILES in .env.prod:
#   seaweedfs   bundled S3-compatible storage (driver documents and photos, private) behind
#               files.<domain>
#   osrm        self-hosted road router (prepare the data first: deploy/osrm/prepare.sh)
#   monitoring  Prometheus, Grafana, node-exporter (Grafana on 127.0.0.1:${GRAFANA_PORT})
name: sff-taxi-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

# What the API and the worker share. Everything in .env.prod reaches the app; the values below
# are derived from it and win over it.
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://taxi_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}@postgres:5432/taxi
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  # Caddy is the one proxy in front: req.ip (rate limits) is the client's address
  TRUST_PROXY_HOPS: '1'
  # the schema owner's password is for migrations only: blank it in the runtime containers
  POSTGRES_OWNER_PASSWORD: ''

x-app: &app
  image: ${TAXI_API_IMAGE:?set TAXI_API_IMAGE, e.g. ghcr.io/<owner>/sff-taxi-api:1.0.0}
  env_file: ${TAXI_ENV_FILE:-.env.prod}
  restart: unless-stopped
  init: true
  logging: *logging
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }

services:
  # One-shot: applies pending migrations (as the schema owner) before the API and worker
  # start. If it fails, the old API and worker keep running and the new ones do not start.
  migrate:
    image: ${TAXI_API_IMAGE:?set TAXI_API_IMAGE}
    command: ['node', 'dist/core/db/migrate.cli.js']
    environment:
      DATABASE_MIGRATION_URL: postgres://taxi_owner:${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD}@postgres:5432/taxi
    restart: 'no'
    init: true
    healthcheck:
      disable: true
    logging: *logging
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    environment:
      <<: *app-env
    # SIGTERM: stop accepting, end open event streams, close pools
    stop_grace_period: 30s
    deploy:
      # more than one: Caddy spreads requests over all of them (deploy/Caddyfile)
      replicas: ${API_REPLICAS:-1}
      resources:
        limits: { cpus: '1.5', memory: 768m }

  # Outbox dispatcher (realtime, push/SMS, fiscal receipts, licence checks), the dispatch loop
  # (offers every second) and housekeeping (unpaid card rides and top-ups, abandoned uploads).
  # One is enough; more are safe (rows are claimed with SKIP LOCKED).
  worker:
    <<: *app
    command: ['node', 'dist/worker.js']
    environment:
      <<: *app-env
      # the image's health check probes this port instead of the API's
      HEALTH_PORT: '3201'
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { cpus: '1', memory: 512m }

  # The operator (dispatcher) panel (Dockerfile.web); the edge Caddy routes panel.<domain> to it.
  web:
    image: ${TAXI_WEB_IMAGE:?set TAXI_WEB_IMAGE, e.g. ghcr.io/<owner>/sff-taxi-web:1.0.0}
    restart: unless-stopped
    read_only: true
    tmpfs: [/config, /data]
    logging: *logging
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 128m }

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL (Let's Encrypt expiry notices)}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN, e.g. api.example.uz}
      PANEL_DOMAIN: ${PANEL_DOMAIN:?set PANEL_DOMAIN, e.g. panel.example.uz}
      FILES_DOMAIN: ${FILES_DOMAIN:-}
      PANEL_ORIGIN: ${PANEL_ORIGIN:-https://${PANEL_DOMAIN}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
    deploy:
      resources:
        limits: { cpus: '1', memory: 256m }

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    # Tuned for a shared 4 vCPU / 8 GB server (Postgres gets ~3 GB of it). Revisit with
    # pg_stat_statements numbers once real traffic exists.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=5GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=120
      - -c
      - wal_buffers=16MB
      - -c
      - min_wal_size=512MB
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_worker_processes=4
      - -c
      - max_parallel_workers=4
      - -c
      - max_parallel_workers_per_gather=2
      - -c
      - max_parallel_maintenance_workers=2
      - -c
      - idle_in_transaction_session_timeout=60s
      - -c
      - log_min_duration_statement=500ms
      - -c
      - log_lock_waits=on
      - -c
      - log_temp_files=10MB
      - -c
      - log_autovacuum_min_duration=1s
      - -c
      - shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_USER: taxi_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD}
      POSTGRES_DB: taxi
      POSTGRES_INITDB_ARGS: --data-checksums
      TZ: Asia/Tashkent
      # read once by init-roles.sh on the first start of an empty volume
      TAXI_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
    shm_size: 1g
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taxi_owner -d taxi']
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 60s
    logging: *logging
    deploy:
      resources:
        limits: { cpus: '2', memory: 3g }

  # Cache, rate limits, stream tickets and realtime pub/sub only: nothing here must survive
  # (docs/deploy.md, "What Redis holds"). AOF just keeps rate limits across restarts.
  # noeviction: a full Redis refuses writes (visible errors, the RedisMemoryHigh alert fires
  # first) instead of silently evicting keys the API relies on: OTP attempt counters, rate
  # limits, stream tickets, driver GPS trails. Every key has a TTL, so memory stays bounded
  # by traffic; see docs/runbook.md, "Redis memory".
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512m }

  # --- profile seaweedfs: S3-compatible storage on this server -------------------------------
  # Driver documents (passports, licences: personal data) and photos. The apps reach it through
  # Caddy at FILES_DOMAIN with URLs the API presigned; the API talks to it directly
  # (STORAGE_S3_ENDPOINT=http://seaweedfs:8333). One identity, the key pair in .env.prod, and
  # NO anonymous access: every read is a presigned URL.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    profiles: [seaweedfs]
    restart: unless-stopped
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        printf '%s' '{"identities":[{"name":"taxi","credentials":[{"accessKey":"'"$$S3_ACCESS_KEY"'","secretKey":"'"$$S3_SECRET_KEY"'"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024 -volume.max=0
    environment:
      S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
    volumes:
      - s3data:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8333/healthz']
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 10
    logging: *logging
    deploy:
      resources:
        limits: { cpus: '1', memory: 512m }

  # One-shot: creates the private bucket once SeaweedFS is up (the API creates buckets only in
  # development).
  storage-init:
    image: ${TAXI_API_IMAGE:?set TAXI_API_IMAGE}
    profiles: [seaweedfs]
    command: ['node', 'storage-init.mjs']
    env_file: ${TAXI_ENV_FILE:-.env.prod}
    environment:
      STORAGE_S3_ENDPOINT: http://seaweedfs:8333
      POSTGRES_OWNER_PASSWORD: ''
    volumes:
      - ./seaweedfs/storage-init.mjs:/app/storage-init.mjs:ro
    restart: on-failure:5
    healthcheck:
      disable: true
    logging: *logging
    depends_on:
      seaweedfs: { condition: service_healthy }

  # --- profile osrm: road distances and ETAs (ROUTER=osrm, OSRM_URL=http://osrm:5000) --------
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: [osrm]
    restart: unless-stopped
    command:
      [
        'osrm-routed',
        '--algorithm',
        'mld',
        '--max-table-size',
        '200',
        '/data/uzbekistan-latest.osrm',
      ]
    volumes:
      - ./osrm/data/current:/data:ro
    logging: *logging
    deploy:
      resources:
        limits: { cpus: '1', memory: 1536m }

  # --- profile monitoring ---------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    restart: unless-stopped
    # the API's /metrics wants METRICS_TOKEN when it is set; Prometheus reads it from a file
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        printf '%s' "$$METRICS_TOKEN" > /prometheus/metrics_token
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=30d --storage.tsdb.retention.size=5GB
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    logging: *logging
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512m }

  grafana:
    image: grafana/grafana-oss:12.1.1
    profiles: [monitoring]
    restart: unless-stopped
    # never public: open it through an SSH tunnel (docs/deploy.md, "Monitoring")
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    logging: *logging
    depends_on: [prometheus]
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256m }

  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: [monitoring]
    restart: unless-stopped
    command: ['--path.rootfs=/host']
    pid: host
    volumes:
      - /:/host:ro
    logging: *logging
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 64m }

  # Redis memory and rejected writes for the RedisMemoryHigh / RedisRejectingWrites alerts
  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    logging: *logging
    depends_on:
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 64m }

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  s3data:
  promdata:
  grafanadata:
